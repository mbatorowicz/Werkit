name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-build.yml'
      - 'src/features/worker/gps/**'
      - 'src/lib/biometricLogin.ts'

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read app version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Decode Play upload keystore
        id: play_key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/upload-keystore.jks
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "keystore_file=upload-keystore.jks" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "keystore_file=" >> "$GITHUB_OUTPUT"
            echo "::warning::Brak ANDROID_KEYSTORE_BASE64 — AAB/APK będą podpisane kluczem debug (nie nadają się do Google Play). Patrz docs/GOOGLE_PLAY.md."
          fi

      - name: Build Android Release Bundle (AAB)
        working-directory: ./android
        env:
          WERKIT_UPLOAD_KEYSTORE_FILE: ${{ steps.play_key.outputs.keystore_file }}
          WERKIT_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WERKIT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WERKIT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build Android Release APK (APK)
        working-directory: ./android
        env:
          WERKIT_UPLOAD_KEYSTORE_FILE: ${{ steps.play_key.outputs.keystore_file }}
          WERKIT_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WERKIT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WERKIT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build Android Debug APK (CI artifact)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Prepare APK for GitHub Release
        run: cp android/app/build/outputs/apk/release/app-release.apk werkit.apk

      - name: Write APK metadata (werkit-apk-meta.json)
        env:
          PLAY_SIGNING: ${{ steps.play_key.outputs.present }}
        run: |
          node -e "
          const fs = require('fs');
          const pkg = require('./package.json');
          fs.writeFileSync('werkit-apk-meta.json', JSON.stringify({
            version: pkg.version,
            packageVersion: pkg.version,
            buildType: 'release',
            signing: process.env.PLAY_SIGNING === 'true' ? 'play-upload' : 'debug',
            commitSha: process.env.GITHUB_SHA,
            builtAt: new Date().toISOString(),
          }, null, 2));
          "

      - name: Remove previous android-latest release
        run: |
          gh release delete android-latest -y 2>/dev/null || true
          git push origin :refs/tags/android-latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to GitHub Release (android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Werkit Android (najnowszy build)
          body: |
            Automatyczny build z gałęzi `main`.
            **Jeden plik APK dla wszystkich organizacji** — logowanie wybiera firmę w aplikacji.
            Wersja z package.json: ${{ steps.pkg.outputs.version }}
            Podpis: ${{ steps.play_key.outputs.present == 'true' && 'klucz uploadu Google Play' || 'debug (nie do Play Console)' }}
            AAB do Play Console jest w artefaktach workflow (`werkit-app-release-bundle`).
          files: |
            werkit.apk
            werkit-apk-meta.json
          make_latest: false

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v7
        with:
          name: werkit-app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: werkit-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK (Test)
        uses: actions/upload-artifact@v7
        with:
          name: werkit-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
