apply plugin: 'com.android.application'

import groovy.json.JsonSlurper
def packageJson = new JsonSlurper().parse(file("../../package.json"))
def (major, minor, patch) = packageJson.version.tokenize('.').collect { it.toInteger() }
def computedVersionCode = major * 10000 + minor * 100 + patch

/** Klucz uploadu Google Play (env CI albo android/keystore.properties). Brak pliku = podpis debug (sideload). */
def resolvePlayUploadSigning() {
    def storePath = System.getenv("WERKIT_UPLOAD_KEYSTORE_FILE") ?: ""
    def storePass = System.getenv("WERKIT_UPLOAD_KEYSTORE_PASSWORD") ?: ""
    def alias = System.getenv("WERKIT_UPLOAD_KEY_ALIAS") ?: ""
    def keyPass = System.getenv("WERKIT_UPLOAD_KEY_PASSWORD") ?: ""
    def propsFile = rootProject.file("keystore.properties")
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { stream -> props.load(stream) }
        if (!storePath) storePath = (props["storeFile"] ?: "").toString()
        if (!storePass) storePass = (props["storePassword"] ?: "").toString()
        if (!alias) alias = (props["keyAlias"] ?: "").toString()
        if (!keyPass) keyPass = (props["keyPassword"] ?: "").toString()
    }
    if (!storePath || !storePass || !alias || !keyPass) {
        return null
    }
    def resolved = rootProject.file(storePath)
    if (!resolved.exists()) {
        return null
    }
    return [
        storeFile: resolved,
        storePassword: storePass,
        keyAlias: alias,
        keyPassword: keyPass,
    ]
}

def playUploadSigning = resolvePlayUploadSigning()

android {
    namespace = "com.werkit.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.werkit.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName packageJson.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    signingConfigs {
        play {
            if (playUploadSigning != null) {
                storeFile playUploadSigning.storeFile
                storePassword playUploadSigning.storePassword
                keyAlias playUploadSigning.keyAlias
                keyPassword playUploadSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            minifyEnabled false
            if (playUploadSigning != null) {
                signingConfig signingConfigs.play
            } else {
                // Sideload / CI bez sekretów Play — podpis debug, buildType=release (nie debuggable).
                logger.warn("Werkit: brak upload keystore — release podpisany kluczem debug. Google Play wymaga android/upload-keystore.jks (patrz docs/GOOGLE_PLAY.md).")
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
